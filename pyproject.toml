[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ovir-gui"
version = "0.0.1"
authors = [
  { name = "Ryuto Yoshida" },
]
description = "Browser GUI to run, review, compare and export open-vocabulary classification, detection and segmentation on images and videos."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pillow",
    "torch",
    "opencv-contrib-python",
    "omegaconf",
    "pydantic>=2",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "dataclass-initializer @ git+https://github.com/ry-yoshida-dev/DataclassInitializer.git@60ed88a29184474aed069ab9253070923b5dcff0",
    "geometry @ git+https://github.com/ry-yoshida-dev/Geometry.git@7a019d2696877c2beff959d8bb4b2e1efc9880c1",
    "object-detection-format @ git+https://github.com/ry-yoshida-dev/ObjectDetectionFormat.git@f5edaa53c41c5b9b3db1ed9bbee49af8d14853ce",
    "segmentation-format @ git+https://github.com/ry-yoshida-dev/SegmentationFormat.git@5fa833f0b8c143e9fddb84d1ab932bfa38855c82",
    "video-handler @ git+https://github.com/ry-yoshida-dev/VideoHandler.git@8e9b5c0c133162b610b15b24f6f7e572eb3873bf",
    "time-series-iterator @ git+https://github.com/ry-yoshida-dev/TimeSeriesIterator.git@ddbe88a0861d8229b5acb0a201c891fad9926b3c",
    "open-vocabulary-classification @ git+https://github.com/ry-yoshida-dev/OpenVocabularyClassification.git@361ce2c41b6701a2dc9e7bea14ee2d60fab8c91f",
    "open-vocabulary-detector @ git+https://github.com/ry-yoshida-dev/OpenVocabularyDetector.git@6e2300c7e7cc75c97b09e34cda9eefef71b6029e",
    "open-vocabulary-segmentation @ git+https://github.com/ry-yoshida-dev/OpenVocabularySegmentation.git@a08eea4103d2d9fbd06f7d01c34b1a92022d24bd",
]

[project.scripts]
ovir-gui = "ovir_gui.__main__:main"

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/OVIR-GUI"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/OVIR-GUI/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx", "mypy", "basedpyright", "ruff"]
ultralytics = [
    "open-vocabulary-detector[ultralytics] @ git+https://github.com/ry-yoshida-dev/OpenVocabularyDetector.git@6e2300c7e7cc75c97b09e34cda9eefef71b6029e",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ovir_gui = ["py.typed", "models/*.json", "web/static/*", "web/static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportMissingTypeStubs = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "ERA", "BLE", "RUF", "C4", "PIE", "PERF", "ISC"]
ignore = ["ISC003"]

[tool.ruff.lint.isort]
known-first-party = ["ovir_gui"]
