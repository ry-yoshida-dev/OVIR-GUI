[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ovir-gui"
version = "0.0.1"
authors = [
  { name = "Ryuto Yoshida" },
]
description = "Browser GUI to run, review, compare and export open-vocabulary classification, detection and segmentation on images and videos."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pillow",
    "torch",
    "torchcodec",
    "opencv-contrib-python",
    "omegaconf",
    "pydantic>=2",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "dataclass-initializer @ git+https://github.com/ry-yoshida-dev/DataclassInitializer.git",
    "geometry @ git+https://github.com/ry-yoshida-dev/Geometry.git",
    "classification-format @ git+https://github.com/ry-yoshida-dev/ClassificationFormat.git",
    "object-detection-format @ git+https://github.com/ry-yoshida-dev/ObjectDetectionFormat.git",
    "segmentation-format @ git+https://github.com/ry-yoshida-dev/SegmentationFormat.git",
    "video-handler @ git+https://github.com/ry-yoshida-dev/VideoHandler.git",
    "time-series-iterator @ git+https://github.com/ry-yoshida-dev/TimeSeriesIterator.git",
    "open-vocabulary-classification @ git+https://github.com/ry-yoshida-dev/OpenVocabularyClassification.git",
    "open-vocabulary-detector @ git+https://github.com/ry-yoshida-dev/OpenVocabularyDetector.git",
    "open-vocabulary-segmentation @ git+https://github.com/ry-yoshida-dev/OpenVocabularySegmentation.git",
]

[project.scripts]
ovir-gui = "ovir_gui.__main__:main"

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/OVIR-GUI"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/OVIR-GUI/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx", "mypy", "basedpyright", "ruff"]
ultralytics = [
    "open-vocabulary-detector[ultralytics] @ git+https://github.com/ry-yoshida-dev/OpenVocabularyDetector.git",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ovir_gui = ["py.typed", "inference/benchmarks/*.json", "web/static/*", "web/static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportMissingTypeStubs = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "ERA", "BLE", "RUF", "C4", "PIE", "PERF", "ISC"]
ignore = ["ISC003"]

[tool.ruff.lint.isort]
known-first-party = ["ovir_gui"]

[tool.uv]
exclude-newer = "7 days"

# On Linux, torch and torchcodec come from the PyTorch CUDA 13.2 index, so torchcodec can use the GPU and the two
# builds always match. Elsewhere they come from PyPI.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]
torchcodec = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]
