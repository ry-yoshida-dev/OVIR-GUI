name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      # torchcodec loads the system FFmpeg to encode browser-playable videos.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync basedpyright
      - run: uv run --no-sync pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/lint/package-lock.json
      # Install scripts are skipped; the only one installs the lint packages, done explicitly below.
      - run: npm ci --ignore-scripts
      - run: npm --prefix lint ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - name: Committed build matches the sources
        run: |
          changes="$(git status --porcelain -- ../src/ovir_gui/web/static)"
          if [ -n "$changes" ]; then
            echo "::error::src/ovir_gui/web/static is out of date. Run npm run build in frontend/ and commit the result."
            echo "$changes"
            exit 1
          fi
