<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OVIR GUI Embedding Example</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --panel: #ffffff;
        --border: #d9dce1;
        --text: #1d2025;
        --muted: #6b717b;
        --accent: #2f6fdb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17191c;
          --panel: #1f2226;
          --border: #33373d;
          --text: #e6e8eb;
          --muted: #9ca3ad;
          --accent: #5b8ff0;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      aside {
        width: 360px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-right: 1px solid var(--border);
        background: var(--panel);
        overflow: auto;
      }
      main {
        flex: 1;
        position: relative;
      }
      input,
      button,
      textarea {
        font: inherit;
        color: inherit;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 4px 8px;
      }
      button {
        cursor: pointer;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        color: var(--muted);
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      pre {
        margin: 0;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 5px;
        max-height: 40vh;
        overflow: auto;
        font-size: 11px;
        white-space: pre-wrap;
      }
      .window {
        position: absolute;
        left: 40px;
        top: 40px;
        width: min(1100px, calc(100% - 80px));
        height: min(760px, calc(100% - 80px));
        display: none;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(15, 20, 30, 0.25);
        overflow: hidden;
        resize: both;
      }
      .window.open {
        display: flex;
      }
      .window-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        cursor: move;
        user-select: none;
      }
      .window-bar b {
        flex: 1;
      }
      iframe {
        flex: 1;
        border: 0;
        width: 100%;
      }
      .hint {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <aside>
      <b>Host application (stands in for a GIS)</b>
      <label>
        OVIR GUI address (with token)
        <input id="address" type="text" value="http://localhost:8000/?token=change-me-to-a-long-secret" />
      </label>
      <label>
        Picture paths on the server, one per line
        <textarea id="paths" rows="4" placeholder="/data/photos/IMG_0012.jpg"></textarea>
      </label>
      <div class="row">
        <button id="open">Open in window</button>
        <button id="results">Get model results</button>
      </div>
      <div class="hint" id="status">Window closed.</div>
      <pre id="log"></pre>
    </aside>
    <main>
      <div class="hint" style="padding: 12px">Map area of the host application.</div>
      <div class="window" id="window">
        <div class="window-bar" id="window-bar">
          <b>OVIR GUI</b>
          <button id="close">Close</button>
        </div>
        <iframe id="frame" title="OVIR GUI" allow="clipboard-write"></iframe>
      </div>
    </main>
    <script>
      const frame = document.getElementById("frame");
      const windowElement = document.getElementById("window");
      const status = document.getElementById("status");
      const log = document.getElementById("log");
      const pending = new Map();
      let isReady = false;
      let queued = [];
      let requestCounter = 0;

      const address = () => new URL(document.getElementById("address").value);
      const paths = () =>
        document
          .getElementById("paths")
          .value.split("\n")
          .map((line) => line.trim())
          .filter((line) => line !== "");

      function write(title, value) {
        log.textContent = `${title}\n${JSON.stringify(value, null, 2)}\n\n${log.textContent}`.slice(0, 20000);
      }

      function send(message) {
        requestCounter += 1;
        const requestId = `request-${requestCounter}`;
        const promise = new Promise((resolve, reject) => pending.set(requestId, { resolve, reject }));
        const post = () => frame.contentWindow.postMessage({ ...message, request_id: requestId }, address().origin);
        if (isReady) post();
        else queued.push(post);
        return promise;
      }

      window.addEventListener("message", (event) => {
        if (event.source !== frame.contentWindow || event.origin !== address().origin) return;
        const message = event.data;
        switch (message.type) {
          case "ovir-gui:ready":
            isReady = true;
            status.textContent = `Connected (protocol ${message.version}).`;
            queued.forEach((post) => post());
            queued = [];
            break;
          case "ovir-gui:response": {
            const waiting = pending.get(message.request_id);
            pending.delete(message.request_id);
            if (waiting !== undefined) {
              if (message.ok) waiting.resolve(message.payload);
              else waiting.reject(new Error(message.error));
            }
            break;
          }
          case "ovir-gui:current-changed":
            status.textContent = `Showing ${message.path ?? "nothing"}${message.frame === null ? "" : ` #${message.frame}`}`;
            break;
        }
      });

      function openWindow() {
        if (!windowElement.classList.contains("open")) {
          isReady = false;
          frame.src = address().href;
          windowElement.classList.add("open");
          status.textContent = "Connecting…";
        }
      }

      document.getElementById("open").addEventListener("click", () => {
        const chosen = paths();
        openWindow();
        if (chosen.length === 0) return;
        send({ type: "ovir-gui:open", paths: chosen, show: chosen[0] })
          .then(() => write("Opened", chosen))
          .catch((error) => write("Open failed", error.message));
      });
      document.getElementById("results").addEventListener("click", () => {
        send({ type: "ovir-gui:get-results", paths: paths().length > 0 ? paths() : null })
          .then((document) => write("Model results", document))
          .catch((error) => write("Request failed", error.message));
      });
      document.getElementById("close").addEventListener("click", () => {
        windowElement.classList.remove("open");
        frame.removeAttribute("src");
        isReady = false;
        status.textContent = "Window closed.";
      });

      const bar = document.getElementById("window-bar");
      bar.addEventListener("pointerdown", (event) => {
        if (event.target.tagName === "BUTTON") return;
        const startX = event.clientX - windowElement.offsetLeft;
        const startY = event.clientY - windowElement.offsetTop;
        frame.style.pointerEvents = "none";
        const move = (moveEvent) => {
          windowElement.style.left = `${moveEvent.clientX - startX}px`;
          windowElement.style.top = `${moveEvent.clientY - startY}px`;
        };
        const stop = () => {
          frame.style.pointerEvents = "";
          window.removeEventListener("pointermove", move);
          window.removeEventListener("pointerup", stop);
        };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", stop);
      });
    </script>
  </body>
</html>
